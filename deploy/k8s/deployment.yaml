apiVersion: apps/v1
kind: Deployment
metadata:
  name: adfilter
spec:
  replicas: 1
  # sqlite on a ReadWriteOnce volume and the in-process rate limiter both break
  # with two pods alive at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adfilter
  template:
    metadata:
      labels:
        app: adfilter
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: server
          image: ghcr.io/belaytzev/adfilter-server:latest
          args: ["-addr=:8080"]
          env:
            - name: ADFILTER_SERVER_DB
              value: /data/adfilter-server.db
            # Whose CF-Connecting-IP is believed; see ratelimit.go. This is the
            # whole pod CIDR, so any pod in the cluster can set the header and
            # pick its own write-limit bucket. Narrow it to the tunnel pod's
            # address in a cluster that runs workloads you do not control.
            - name: ADFILTER_TRUSTED_PROXIES
              value: 10.42.0.0/16
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adfilter-data
