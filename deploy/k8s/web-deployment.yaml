apiVersion: apps/v1
kind: Deployment
metadata:
  name: adassay-web
spec:
  # ponytail: in-process limiter and cache, a shared one if this needs two pods
  replicas: 1
  selector:
    matchLabels:
      app: adassay-web
  template:
    metadata:
      labels:
        app: adassay-web
    spec:
      containers:
        - name: web
          image: ghcr.io/belaytzev/adassay-web:latest
          args: ["-addr=:8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # four concurrent analyses, each holding an 8MiB page and its segments
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
