# Cluster-internal, like the server's: the public entry point is a Cloudflare
# Tunnel pointing at this service. adassay.com must reach it, because the page
# carries the go-import meta tag that makes `go get adassay.com/...` resolve.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adassay-web
spec:
  rules:
    - host: adassay-web.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adassay-web
                port:
                  name: http
