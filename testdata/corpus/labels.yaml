# Hand-written ground truth for the calibration corpus.
#
# ads: segments that carry a deterministic commercial signal — a paid-placement
# disclosure, a promo-code offer, or a buy link the publisher itself marked as
# sponsored or affiliate. Editorial prose inside a monetised roundup is the grey
# zone L2 deliberately does not claim, and stays unlabelled until the fuzzy
# features and the judge extend this file.
#
# A citation that happens to carry an affiliate tag is not advertising: the
# paragraph exists to inform. Both kinds are present on purpose, because the
# thresholds have to separate them.
#
# native: advertising by intent that carries no deterministic signal at all —
# product-led prose inside a monetised roundup. Labelled selectively, a handful
# of representative paragraphs per page: the point is to measure whether the
# fuzzy features and the judge reach this class, not to enumerate every case.
# Without it the metrics look perfect on a page that is 98% unfiltered selling.
#
# hidden: the page carries text aimed at parsers rather than at readers. Real
# pages are labelled false even when L1 fires on their boilerplate — those
# disagreements are the L1 false-positive baseline, not ground truth.
#
# Entries are matched by prefix against the whitespace-collapsed segment text,
# never by segment id: ids are positional and move with any change to
# segmentation.

