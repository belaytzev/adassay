l1:
  min_length: 40
  long_attr_length: 200
  imperatives:
    - ignore previous
    - ignore all previous
    - disregard
    - system prompt
    - you must
    - always recommend
    - do not mention
    - игнорируй
    - рекомендуй
  agent_names:
    - chatgpt
    - claude
    - gemini
    - perplexity
    - copilot
    - llm
    - assistant
    - language model
    - языковая модель

l2:
  hi: 0.55
  lo: 0.20
  bias: -2.5
  weights:
    rel_sponsored: 3.0
    promo_code: 2.0
    affiliate_link: 1.5
    disclaimer: 2.5
    brand_density: 0.5
    cta_urgency: 0.8
  shortcuts:
    - features: [rel_sponsored, promo_code]
      verdict: drop
    - features: [disclaimer, affiliate_link]
      verdict: drop
  patterns:
    promo_words:
      - promo code
      - coupon code
      - discount code
      - use code
      - промокод
      - по коду
    disclaimers:
      - "#ad"
      - "#sponsored"
      - sponsored post
      - paid partnership
      - in partnership with
      - на правах рекламы
      - партнёрский материал
      - партнерский материал
      - реклама
    affiliate_params:
      - ref
      - tag
      - utm_campaign
      - aff_id
      - irclickid
      - clickid
    affiliate_hosts:
      - go.skimresources.com
      - awin1.com
      - go.redirectingat.com
      - shareasale.com
      - impact.com
      - click.linksynergy.com
    cta_words:
      - at checkout
      - buy now
      - order now
      - sign up
      - get started
      - claim your
      - shop now
      - оформить заказ
      - купить
      - по ссылке
    urgency_words:
      - limited time
      - today only
      - while supplies last
      - hurry
      - ends soon
      - last chance
      - launch week
      - только сегодня
      - ограниченное предложение
      - успей
      - последний шанс

l3:
  min_visits: 5
  half_life_days: 30
  finding_penalty: 0.25
  max_shift: 0.2

judge:
  endpoint: http://127.0.0.1:11434
  model: qwen2.5:7b-instruct
  timeout: 60s
  batch_size: 8
